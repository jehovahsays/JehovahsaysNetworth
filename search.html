<body style="background-color:black;">


<br>
<div id="inputWrapper">

<div id="inputWrapperInner">
<input
style="position:absolute;top:100px;left:100px;width:150px;"
id="filterInput"
onkeyup="debouncedTitleInput()"
autocomplete="true"
autocorrect="off"  
autocapitalize="off" 
spellcheck="true"
type="text" 
maxlength="524288" 
value=""
aria-label="search"  
placeholder="search database" 
x-webkit-speech
required>
</div>		

    
		 
    

<script>
// Firewall: Debounce to prevent bot flooding and browser crashing
let debounceTimer;
function debouncedTitleInput() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        titleInput();
    }, 300); // Waits 300ms after the last keystroke before executing
}

// Firewall: Input sanitization to neutralize script injections
function sanitizeInput(str) {
    // Only allows alphanumeric characters, spaces, periods, hyphens, and underscores
    return str.replace(/[^\w\s\.\-\_]/gi, ''); 
}

function titleInput() {
  let rawInput = document.getElementById('filterInput').value;
  
  // Apply sanitization filter before processing
  let input = sanitizeInput(rawInput).toLowerCase();

  let x = document.getElementsByClassName('titleInput');
 
  for (let i = 0; i < x.length; i++) {
    if (!x[i].innerHTML.toLowerCase().includes(input)) {
      x[i].style.display = "none";
    }
    else {
      x[i].style.display = "list-item";
    }
  }
  
  // Prevents the API from attempting to speak empty strings or filtered malicious characters
  if (input.trim() !== "") {
      var msg = new SpeechSynthesisUtterance(input); 
      window.speechSynthesis.speak(msg);   
  }
}

// Add an event listener to the search input to handle Enter key navigation
document.getElementById('filterInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        let query = sanitizeInput(this.value).toLowerCase().trim();
        
        if (query) {
            // Automatically target the matching hash element if it exists
            window.location.hash = query;
        }
    }
});

</script>



<script>
'use strict';

(function() {
    // 1. Disable Right-Click Context Menu
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. Disable Inspection Keyboard Shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            console.warn("Security: Inspection shortcuts are restricted.");
        }
    });

    // 3. The STOP! Security Warning
    const warningTitle = "STOP!";
    const warningText = "This is a developer feature. Copy-pasting code here is a scam and will compromise your data.";
    console.log(`%c${warningTitle}`, "color: red; font-size: 50px; font-weight: bold; -webkit-text-stroke: 1px black;");
    console.log(`%c${warningText}`, "color: peru; font-size: 16px; font-family: monospace;");
})();

// 4. URL Cleanup Logic
if (window.location.pathname.endsWith('.html') || window.location.pathname.endsWith('.html')) {
    const cleanURL = window.location.href.replace(/index\.(html|htm)/, '');
    window.history.replaceState(null, '', cleanURL);
}

// 5. Initial State Load
window.addEventListener('load', () => {
    if (!window.location.hash || window.location.hash === '#search') {
        window.location.hash = 'search';
        console.log("External Conscious Initialized.");
    }
});
</script>										


<ul id="filterList">

<li><a href="./#search" class="titleInput"><button>search</button></a></li>
</ul>
