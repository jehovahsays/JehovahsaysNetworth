<head>

    <style>
        body { margin: 0; overflow: hidden; touch-action: none; }
        
        .joystick-container {
            position: fixed;
            bottom: 50px;
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }

        #joystick-left { left: 50px; }
        #joystick-right { right: 50px; }

        .handle {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 255, 0.8);
            border-radius: 50%;

        #handle-right { background: rgba(255, 0, 0, 0.8); }

        #fire-button {
            position: fixed;
            bottom: 180px;
            right: 70px;
            width: 70px;
            height: 70px;
            background: rgba(255, 69, 0, 0.8);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-family: Arial;
            z-index: 15;
            touch-action: none;
            display: flex;
            align-items: center;

        /* Camera & Zoom Control Overlay UI */
        #camera-controls-ui {
            position: fixed;
            bottom: 180px;
            left: 50px;
            display: flex;

            z-index: 15;
        }

        .cam-btn {
            background: rgba(0, 123, 255, 0.85);
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-family: Arial, sans-serif;
            padding: 10px 14px;
            font-size: 13px;
            touch-action: none;
            cursor: pointer;
        }
        
        #orbit-controls-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }

        /* Clock Menu Toggle Button */
        #clock-menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 42px;
            height: 42px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 8px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            user-select: none;
        }

        /* Imported Time / Calendar Container from map.html */
        #time-container {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            padding: 15px;
            border: 1px solid #0f0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            width: 220px;
        }

        #time-container.open {
            display: block;
        }

        #time-container input {
            background: #111;
            border: 1px solid #0f0;
            color: #0f0;
            margin-top: 5px;
            padding: 5px;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Top Center Responsive Minimap */
        #minimap-ui {
            position: fixed;
            top: 0px;
            left: 60%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #0f0;
            border-radius: 8px;
            z-index: 500;
            pointer-events: none;
        }

        .lil-gui { z-index: 2 !important; }

        @media all and ( max-width: 640px ) {
            .lil-gui.root { 
                right: 0px;
                top: auto;
                max-height: 100%;
                max-width: 30%;
                bottom: 0px;
            }
        }
		
		#user-status-display {
            position: fixed;
            right: 20px;
            top: 110px; 
            width: 140px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #0f0;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            z-index: 1000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
	
    <title>play</title>	
    <script>
    (function () {
      function showError(msg) {
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.backgroundColor = '#ff4c4c';
        errorDiv.style.color = 'white';
        errorDiv.style.fontFamily = 'Arial, sans-serif';
        errorDiv.style.padding = '15px';
        errorDiv.style.zIndex = '9999';
        errorDiv.style.textAlign = 'center';
        errorDiv.textContent = msg;
        document.body.appendChild(errorDiv);
      }

      const canvas = document.createElement('canvas');
      const webgl = !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      if (!webgl) {
        document.addEventListener('DOMContentLoaded', () => showError('WebGL not supported.'));
      }
      if (!navigator.gpu) {
        document.addEventListener('DOMContentLoaded', () => showError('WebGPU not supported.'));
      }
    })();
	
	document.addEventListener("DOMContentLoaded", () => {
	    if(typeof updateUserStatus === "function") updateUserStatus();
	});
    </script>

<body>  
<div id="container">
  <nav id="sidebar"></nav>

  <div id="user-status-display" style="font-family: 'Courier New', monospace; color: #0f0; font-weight: bold;"></div>

  <!-- Clock Button & Calendar Dropdown Container (Imported from map.html) -->

  <div id="time-container">
      <strong>GAME CLOCK</strong>

  </div>

  <main id="main-content-wrapper" itemscope itemtype="https://schema.org/WebPage">
    <meta itemprop="url" content="https://jehovahsays.github.io/jehovahsaysnetworth/">
    <div id="page-container"></div> 
  </main>

  <canvas id="minimap-ui" width="120" height="120"></canvas>

    <div id="info"></div>
    <div id="orbit-controls-info">
        <a href="./map.html" target="_blank" rel="noopener"><button class="infobox">Exit</button></a>
    </div>
        
    <div id="joystick-left" class="joystick-container"><div id="handle-left" class="handle"></div></div>
    <div id="joystick-right" class="joystick-container"><div id="handle-right" class="handle"></div></div>

    <!-- Camera View Mode & Zoom UI Controls -->

    <div id="controller-selector" style="position: fixed; top: 55px; left: 125px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 5px; color: white; font-family: Arial;">
        <label>Controller Mode: </label>
        <select id="inputModeSelect" style="background: #222; color: #fff; padding: 4px; border-radius: 4px;">
            <option value="auto">Auto-Detect / Multi-Input</option>
            <option value="touch">Touchscreen Joysticks</option>
            <option value="keyboard">Keyboard & Mouse (WASD)</option>
            <option value="gamepad">Bluetooth Gamepad</option>
        </select>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./examples/build/three.module.js",
                "three/addons/": "./examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		
        // --- MULTI-CONTROLLER INPUT STATE ---
        const inputConfig = {
            mode: 'auto',
            keys: { KeyW: false, KeyS: false, KeyA: false, KeyD: false },
            mouseLookActive: false
        };

        // Camera State Controls
        let isZoomed = false;
        let isMapView = false;
        let cameraModeIndex = 0; // 0: 3rd Person, 1: 1st Person, 2: Top-Down
        const cameraModes = ['3RD', '1ST', 'TOP'];

        // --- GAME CLOCK & CALENDAR STATE (Imported from map.html) ---
        let simulationTime = new Date();
        const timeInput = document.getElementById('ai-datetime');
        const timeDisplay = document.getElementById('display-time');
        const clockBtn = document.getElementById('clock-menu-btn');
        const timeContainer = document.getElementById('time-container');

        // Toggle calendar drop menu on single click
        clockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            timeContainer.classList.toggle('open');
        });

        // Initialize input date time value
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        if (timeInput) {
            timeInput.value = now.toISOString().slice(0, 16);
            timeInput.addEventListener('change', (e) => { 
                simulationTime = new Date(e.target.value); 
            });
        }

        // Listen for mode changes from user UI
        document.getElementById('inputModeSelect')?.addEventListener('change', (e) => {
            inputConfig.mode = e.target.value;
        });

        function toggleZoom() {
            isZoomed = !isZoomed;
            const btn = document.getElementById('zoom-toggle-btn');
            if (btn) btn.textContent = `ZOOM: ${isZoomed ? 'ON' : 'OFF'}`;
        }

        function cycleCameraMode() {
            cameraModeIndex = (cameraModeIndex + 1) % cameraModes.length;
            const btn = document.getElementById('camera-mode-btn');
            if (btn) btn.textContent = `CAM: ${cameraModes[cameraModeIndex]}`;
        }

        function toggleMapView() {
            isMapView = !isMapView;
            const btn = document.getElementById('map-view-btn');
            if (btn) btn.textContent = `MAP: ${isMapView ? 'ON' : 'OFF'}`;
        }

        document.getElementById('zoom-toggle-btn')?.addEventListener('click', (e) => { e.preventDefault(); toggleZoom(); });
        document.getElementById('camera-mode-btn')?.addEventListener('click', (e) => { e.preventDefault(); cycleCameraMode(); });
        document.getElementById('map-view-btn')?.addEventListener('click', (e) => { e.preventDefault(); toggleMapView(); });

        // A. Keyboard & Mouse Controller Logic
        window.addEventListener('keydown', (e) => {
            if (inputConfig.mode === 'touch') return;
            if (inputConfig.keys.hasOwnProperty(e.code)) inputConfig.keys[e.code] = true;
            if (e.code === 'Space') handlePlayerShoot();
            if (e.code === 'KeyZ') toggleZoom();
            if (e.code === 'KeyC') cycleCameraMode();
            if (e.code === 'KeyM') toggleMapView();
            if (e.code === 'KeyF' || e.code === 'KeyE') toggleDriveVehicle();
        });

        window.addEventListener('keyup', (e) => {
            if (inputConfig.keys.hasOwnProperty(e.code)) inputConfig.keys[e.code] = false;
        });

        window.addEventListener('mousedown', (e) => {
            if (inputConfig.mode === 'touch') return;
            if (e.target.tagName !== 'BUTTON' && !e.target.closest('#clock-menu-btn') && !e.target.closest('#time-container') && !e.target.closest('.joystick-container') && !e.target.closest('.lil-gui') && !e.target.closest('#camera-controls-ui')) {
                renderer.domElement.requestPointerLock();
                inputConfig.mouseLookActive = true;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if ((inputConfig.mode === 'keyboard' || inputConfig.mode === 'auto') && document.pointerLockElement === renderer.domElement) {
                lookX = e.movementX * 0.01;
            }
        });

        // B. Bluetooth Gamepad Controller Poll Engine
        function pollBluetoothControllers() {
            if (inputConfig.mode === 'touch') return;
            
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let i = 0; i < gamepads.length; i++) {
                const gp = gamepads[i];
                if (!gp) continue;

                const deadzone = 0.15;
                let axisX = gp.axes[0];
                let axisZ = gp.axes[1];
                if (Math.abs(axisX) > deadzone) moveX = axisX;
                if (Math.abs(axisZ) > deadzone) moveZ = axisZ;

                let rightAxisX = gp.axes[2];
                if (Math.abs(rightAxisX) > deadzone) {
                    lookX = rightAxisX * 0.5;
                }

                if (gp.buttons[0] && gp.buttons[0].pressed) {
                    if (!window.gpFirePressed) {
                        handlePlayerShoot();
                        window.gpFirePressed = true;
                    }
                } else {
                    window.gpFirePressed = false;
                }

                if (gp.buttons[6] && gp.buttons[6].pressed) {
                    if (!window.gpL2Pressed) {
                        toggleZoom();
                        window.gpL2Pressed = true;
                    }
                } else {
                    window.gpL2Pressed = false;
                }

                if (gp.buttons[3] && gp.buttons[3].pressed) {
                    if (!window.gpTrianglePressed) {
                        cycleCameraMode();
                        window.gpTrianglePressed = true;
                    }
                } else {
                    window.gpTrianglePressed = false;
                }

                break;
            }
        }

        let container, clock, gui, mixer, actions, activeAction, previousAction, camera, scene, renderer, model;
        let moveX = 0, moveZ = 0, lookX = 0, lookY = 0, characterRotationY = 0; 
        let orbitControls, orbitMode = false;
        let playerScore = 0, playerHealth = 10, playerSize = 1.0;
        let bullets = [], gameActive = true;

        let bosses = [];
        let currentRound = 1;
        let healthPackages = [];

        // Minimap setup
        const minimapCanvas = document.getElementById('minimap-ui');
        const minimapCtx = minimapCanvas.getContext('2d');

        const api = { state: 'Walking' };

        function loadout() {
            window.location.href = './map.html';
        }

        function createUsername(text, color) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.font = 'Bold 40px Arial';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 45);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
            sprite.scale.set(4, 1, 1);
            return sprite;
        }

        function getActiveUsername() {
            try {
                const storedUser = localStorage.getItem('mev_wiki_auth_key') || localStorage.getItem('mev_active_session');
                if (storedUser && storedUser.trim() !== '') {
                    return storedUser.split(':')[0];
                }
            } catch (e) {
                console.error('Failed reading security perimeter token:', e);
            }
            return '::1';
        }

        async function logScoreToRecentChanges() {
            const currentName = getActiveUsername();
            const storageKey = 'mev_wiki_changes';
            try {
                let currentChanges = [];
                const rawData = localStorage.getItem(storageKey);
                if (rawData) {
                    currentChanges = JSON.parse(rawData);
                }
                const gameChangeEntry = {
                    title: ` Game High Score: ${playerScore} pts (${currentName})`,
                    timestamp: new Date().toISOString(),
                    type: 'Update'
                };
                currentChanges.unshift(gameChangeEntry);
                localStorage.setItem(storageKey, JSON.stringify(currentChanges));
            } catch (err) {
                console.error('Failed writing tracking token:', err);
            }
        }

        function spawnHealthPackage(position) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 64; canvas.height = 64;
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❤️', 32, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.copy(position);
            sprite.position.y = 1.5;
            sprite.scale.set(3, 3, 3);
            
            scene.add(sprite);
            healthPackages.push(sprite);
        }

        function spawnBossRound() {
            bosses = [];
            showNotification(`Round ${currentRound}: Spawned ${currentRound} Bosses!`);
            
            for (let i = 0; i < currentRound; i++) {
                const geometry = new THREE.BoxGeometry(5, 5, 5);
                const material = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                const mesh = new THREE.Mesh(geometry, material);
                
                const offsetX = (i - (currentRound - 1) / 2) * 20;
                const baseZ = model ? model.position.z - 40 : -20;
                const baseX = model ? model.position.x + offsetX : offsetX;
                
                mesh.position.set(baseX, 5, baseZ);
                
                const label = createUsername('::1', '#ff0000');
                label.position.y = 4;
                mesh.add(label);
                
                scene.add(mesh);
                
                bosses.push({
                    mesh: mesh,
                    health: 5,
                    attackTimer: Math.random() * 2,
                    seedOffset: i * 500
                });
            }
        }

        function createBullet(position, direction) {
            const geometry = new THREE.SphereGeometry(0.5, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(geometry, material);
            bullet.position.set(position.x, position.y + 2, position.z);
            bullet.direction = direction.normalize();
            bullet.speed = 2.0;
            bullet.isPlayerBullet = true;
            scene.add(bullet);
            bullets.push(bullet);
        }

        function createBossBullet(bossMesh) {
            if (!bossMesh || !gameActive || !model) return;
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
            bullet.position.copy(bossMesh.position);
            const direction = new THREE.Vector3().subVectors(model.position, bossMesh.position).normalize();
            bullet.direction = direction;
            bullet.speed = 1.0;
            bullet.isPlayerBullet = false;
            scene.add(bullet);
            bullets.push(bullet);
        }

        function updateBullets(deltaTime) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.position.addScaledVector(bullet.direction, bullet.speed);
                
                if (model && bullet.position.distanceTo(model.position) > 120) {
                    scene.remove(bullet);
                    bullets.splice(i, 1);
                    continue;
                }
                
                if (bullet.isPlayerBullet) {
                    for (let b = bosses.length - 1; b >= 0; b--) {
                        const targetBoss = bosses[b];
                        if (bullet.position.distanceTo(targetBoss.mesh.position) < 3) {
                            targetBoss.health--;
                            scene.remove(bullet);
                            bullets.splice(i, 1);
                            
                            if (targetBoss.health <= 0) {
                                spawnHealthPackage(targetBoss.mesh.position);
                                scene.remove(targetBoss.mesh);
                                bosses.splice(b, 1);
                                playerScore += 10;
                                logScoreToRecentChanges();
                                playerSize += 0.05;
                                updatePlayerSize();
                                showNotification("Boss Defeated! +10");
                                
                                if (bosses.length === 0) {
                                    currentRound++;
                                    setTimeout(spawnBossRound, 3000);
                                }
                            }
                            break;
                        }
                    }
                } else {
                    if (model && bullet.position.distanceTo(model.position) < 2) {
                        playerHealth--;
                        scene.remove(bullet);
                        bullets.splice(i, 1);
                        if (playerHealth <= 0) {
                            gameActive = false;
                            loadout(); 
                        }
                    }
                }
            }
        }

        function updateBoss(deltaTime) {
            if (!gameActive || !model) return;
            for (let i = 0; i < bosses.length; i++) {
                const boss = bosses[i];
                const timeFactor = Date.now() * 0.001 + boss.seedOffset;
                boss.mesh.position.y = 5 + Math.sin(timeFactor) * 1.5;
                boss.mesh.lookAt(model.position);
                
                boss.attackTimer += deltaTime;
                if (boss.attackTimer > 2.5) { 
                    createBossBullet(boss.mesh);
                    boss.attackTimer = 0;
                }
            }
        }

        function updateHealthPackages() {
            if (!model || !gameActive) return;
            for(let i = healthPackages.length - 1; i >= 0; i--) {
                const pkg = healthPackages[i];
                pkg.position.y = 1.5 + Math.sin(Date.now() * 0.003 + i) * 0.2;
                
                if(model.position.distanceTo(pkg.position) < 3.0) {
                    playerHealth += 25;
                    showNotification("Collected Care Package! +25 HP ❤️");
                    scene.remove(pkg);
                    healthPackages.splice(i, 1);
                }
            }
        }

        function renderMinimap() {
            minimapCtx.clearRect(0, 0, 120, 120);
            minimapCtx.fillStyle = 'rgba(15, 30, 15, 0.7)';
            minimapCtx.fillRect(0, 0, 120, 120);

            if (!model) return;

            const cx = 60;
            const cz = 60;
            const scale = 0.6;

            minimapCtx.save();
            minimapCtx.translate(cx, cz);
            minimapCtx.rotate(-characterRotationY);

            minimapCtx.fillStyle = '#ff0000';
            bosses.forEach(b => {
                const dx = b.mesh.position.x - model.position.x;
                const dz = b.mesh.position.z - model.position.z;
                
                const radarX = dx * scale;
                const radarZ = dz * scale;
                
                const mapX = Math.max(-54, Math.min(54, radarX));
                const mapZ = Math.max(-54, Math.min(54, radarZ));
                
                minimapCtx.beginPath();
                minimapCtx.arc(mapX, mapZ, 3.5, 0, Math.PI * 2);
                minimapCtx.fill();
            });

            minimapCtx.fillStyle = '#00e5ff';
            drivableCars.forEach(car => {
                if (car === activeVehicle) return;
                const mx = Math.max(-54, Math.min(54, (car.position.x - model.position.x) * scale));
                const mz = Math.max(-54, Math.min(54, (car.position.z - model.position.z) * scale));
                minimapCtx.fillRect(mx - 2.5, mz - 2.5, 5, 5);
            });

            minimapCtx.fillStyle = '#00ff00';
            minimapCtx.beginPath();
            minimapCtx.moveTo(0, -7);
            minimapCtx.lineTo(-5, 5);
            minimapCtx.lineTo(5, 5);
            minimapCtx.closePath();
            minimapCtx.fill();
            
            minimapCtx.restore();
        }

        function updatePlayerSize() {
            if (model) model.scale.set(playerSize, playerSize, playerSize);
        }

        function createUI() {
            const uiStyle = "position:absolute; color:white; font-family:Arial; font-weight:bold; background:rgba(0,0,0,0.7); padding:12px 20px; border-radius:10px;";
            
            const score = document.createElement('div');
            score.id = 'scoreDisplay'; 
            score.style = uiStyle + "top:10px; left:10px; font-size:18px;";
            document.body.appendChild(score);
            
            const health = document.createElement('div');
            health.id = 'healthDisplay'; 
            health.style = uiStyle + "top:70px; left:10px; font-size:18px;";
            document.body.appendChild(health);
            
            const notify = document.createElement('div');
            notify.id = 'notification';

        function createDynamicTerrain() {
            const worldSize = 2000;
            const segments = 120;
            const geo = new THREE.PlaneGeometry(worldSize, worldSize, segments, segments);
            
            const colors = [];
            const colorObj = new THREE.Color();
            const pos = geo.attributes.position;

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const distFromCenter = Math.sqrt(vx * vx + vy * vy);

                if (distFromCenter < 90) {
                    colorObj.setHex(0xcbcbcb);
                } else if (distFromCenter > 90 && distFromCenter < 280) {
                    colorObj.setHex(0x3b7a57);
                } else if (distFromCenter >= 280 && distFromCenter < 360) {
                    colorObj.setHex(0xeedd82);
                } else {
                    colorObj.setHex(0x1d4e89);
                }
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const terrainMaterial = new THREE.MeshPhongMaterial({
                vertexColors: true,
                flatShading: true,
                depthWrite: false
            });

            const floor = new THREE.Mesh(geo, terrainMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
        }

            function buildBoldRoads(polylines, colorHex, opacity, yLevel, width, roadType) {
                const positions = [];
                const hw = width * 0.5;

                function pushTri(ax, az, bx, bz, cx, cz) {
                    positions.push(ax, yLevel, az, bx, yLevel, bz, cx, yLevel, cz);
                }

                polylines.forEach((poly, idx) => {
                    const vecs = poly.map(([lat, lon]) => latLonToVec3(lat, lon, yLevel));
                    window.georgiaRoadNetwork.push({ type: roadType, index: idx, points: vecs });

                    for (let i = 0; i < vecs.length - 1; i++) {
                        const p1 = vecs[i];
                        const p2 = vecs[i + 1];
                        const dx = p2.x - p1.x;
                        const dz = p2.z - p1.z;
                        const len = Math.hypot(dx, dz);
                        if (len < 1e-4) continue;

                        const nx = (-dz / len) * hw;
                        const nz = (dx / len) * hw;

                        const ax = p1.x + nx, az = p1.z + nz;
                        const bx = p1.x - nx, bz = p1.z - nz;
                        const cx = p2.x + nx, cz = p2.z + nz;
                        const dx2 = p2.x - nx, dz2 = p2.z - nz;

                        pushTri(ax, az, bx, bz, cx, cz);
                        pushTri(bx, bz, dx2, dz2, cx, cz);

                        pushTri(p2.x - hw, p2.z, p2.x, p2.z - hw, p2.x + hw, p2.z);

        function buildTrafficVehicle(bodyColor, isTruck = false) {
            const group = new THREE.Group();

            } else {
                const chassis = new THREE.Mesh(

                    new THREE.MeshPhongMaterial({ color: bodyColor })
                );
                chassis.position.y = 0.65;
                const cabin = new THREE.Mesh(
                    new THREE.BoxGeometry(1.7, 0.7, 2.1),
                    new THREE.MeshPhongMaterial({ color: 0x222a33 })
                );
                cabin.position.set(0, 1.35, -0.15);
                group.add(chassis, cabin);
            }

            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 10);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const zOff = isTruck ? 1.8 : 1.25;
            [[-1.0, 0.42, zOff], [1.0, 0.42, zOff], [-1.0, 0.42, -zOff], [1.0, 0.42, -zOff]].forEach(([wx, wy, wz]) => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(wx, wy, wz);
                group.add(w);
            });

            // Headlights (+Z front) & Taillights (-Z rear)
            const hlGeo = new THREE.BoxGeometry(0.36, 0.22, 0.1);
            const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
            const tlMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
            const frontZ = isTruck ? 2.52 : 2.12;
            const rearZ = isTruck ? -3.52 : -2.12;
            [-0.65, 0.65].forEach(hx => {
                const hl = new THREE.Mesh(hlGeo, hlMat);
                hl.position.set(hx, 0.72, frontZ);
                const tl = new THREE.Mesh(hlGeo, tlMat);
                tl.position.set(hx, 0.72, rearZ);
                group.add(hl, tl);
            });

            return group;
        }

        function createAmbientTraffic() {
            const roadList = window.georgiaRoadNetwork || [];
            if (roadList.length === 0) return;

            const colors = [0xe74c3c, 0xf1c40f, 0x3498db, 0x2ecc71, 0xecf0f1, 0x9b59b6, 0xe67e22, 0x1abc9c];
            const totalCars = 48;

            for (let i = 0; i < totalCars; i++) {
                const road = roadList[i % roadList.length];
                if (!road.points || road.points.length < 2) continue;

                const isTruck = i % 5 === 0;
                const mesh = buildTrafficVehicle(colors[i % colors.length], isTruck);
                const segIdx = Math.floor(Math.random() * (road.points.length - 1));
                const t = Math.random();
                const dir = Math.random() > 0.5 ? 1 : -1;

                mesh.position.lerpVectors(road.points[segIdx], road.points[segIdx + 1], t);
                mesh.position.y = 0;
                scene.add(mesh);

                trafficVehicles.push({
                    mesh,
                    road: road.points,
                    segIdx,
                    t,
                    dir,
                    speed: (isTruck ? 11 : 15) + Math.random() * 12
                });
            }
        }

        function updateAmbientTraffic(dt) {
            for (let i = 0; i < trafficVehicles.length; i++) {
                const v = trafficVehicles[i];
                const pA = v.road[v.segIdx];
                const pB = v.road[v.segIdx + 1];
                const segLen = pA.distanceTo(pB);
                if (segLen < 0.01) continue;

                v.t += (v.dir * v.speed * dt) / segLen;
                if (v.t >= 1) {
                    if (v.segIdx < v.road.length - 2) {
                        v.segIdx++;
                        v.t = 0;
                    } else {
                        v.dir = -1;
                        v.t = 1;
                    }
                } else if (v.t <= 0) {
                    if (v.segIdx > 0) {
                        v.segIdx--;
                        v.t = 1;
                    } else {
                        v.dir = 1;
                        v.t = 0;
                    }
                }

                v.mesh.position.lerpVectors(v.road[v.segIdx], v.road[v.segIdx + 1], v.t);
                v.mesh.position.y = 0;
                const lookPt = v.dir > 0 ? v.road[v.segIdx + 1] : v.road[v.segIdx];
                v.mesh.lookAt(lookPt.x, 0, lookPt.z);
                v.mesh.translateX(0.95);
            }
        }

        function toggleDriveVehicle() {
            if (!model || !gameActive) return;

            if (activeVehicle) {
                if (activeVehicle.userData.label) activeVehicle.userData.label.visible = true;
                model.position.copy(activeVehicle.position).add(new THREE.Vector3(3.2, 0, 0));
                model.visible = true;
                const exitedName = activeVehicle.userData.carName;
                activeVehicle = null;
                const btn = document.getElementById('drive-btn');
                if (btn) btn.textContent = 'DRIVE (F)';
                showNotification(`Exited ${exitedName}`);
                return;
            }

            let nearest = null;
            let bestDist = 8.5;
            for (let i = 0; i < drivableCars.length; i++) {
                const d = model.position.distanceTo(drivableCars[i].position);
                if (d < bestDist) {
                    bestDist = d;
                    nearest = drivableCars[i];
                }
            }

            if (nearest) {
                activeVehicle = nearest;
                if (activeVehicle.userData.label) activeVehicle.userData.label.visible = false;
                model.visible = false;
                characterRotationY = activeVehicle.rotation.y;
                const btn = document.getElementById('drive-btn');
                if (btn) btn.textContent = 'EXIT CAR (F)';
                showNotification(`Driving: ${activeVehicle.userData.carName}`);
            } else {
                showNotification('Move closer to a parked car [F] to drive!');
            }
        }

        function setupDualJoysticks() {
            const leftJoy = document.getElementById('joystick-left'), rightJoy = document.getElementById('joystick-right');
            const leftH = document.getElementById('handle-left'), rightH = document.getElementById('handle-right');

            leftJoy.addEventListener("touchmove", (e) => {
                const r = leftJoy.getBoundingClientRect();
                moveX = (e.touches[0].clientX - (r.left + 50)) / 50;
                moveZ = (e.touches[0].clientY - (r.top + 50)) / 50;
                leftH.style.transform = `translate(${moveX * 25}px, ${moveZ * 25}px)`;
            });

            rightJoy.addEventListener("touchmove", (e) => {
                const r = rightJoy.getBoundingClientRect();
                lookX = (e.touches[0].clientX - (r.left + 50)) / 50;
                lookY = (e.touches[0].clientY - (r.top + 50)) / 50;
                rightH.style.transform = `translate(${lookX * 25}px, ${lookY * 25}px)`;
            });

            document.getElementById('fire-button').addEventListener("touchstart", (e) => { e.preventDefault(); handlePlayerShoot(); });

            const stop = () => { moveX = 0; moveZ = 0; lookX = 0; lookY = 0; leftH.style.transform = rightH.style.transform = "translate(0,0)"; };
            leftJoy.addEventListener("touchend", stop);
            rightJoy.addEventListener("touchend", stop);
        }

        function createGUI(model, animations) {
            gui = new GUI();
            mixer = new THREE.AnimationMixer(model);
            actions = {};
            const states = ['Idle', 'Walking', 'Running', 'Dance', 'Death', 'Sitting', 'Standing'];
            const emotes = ['Jump', 'Yes', 'No', 'Wave', 'Punch', 'ThumbsUp'];
            
            animations.forEach(clip => {
                const action = mixer.clipAction(clip);
                actions[clip.name] = action;
                if (emotes.includes(clip.name) || states.indexOf(clip.name) >= 4) {
                    action.clampWhenFinished = true;
                    action.loop = THREE.LoopOnce;
                }
            });
			
            const sf = gui.addFolder('States');
            sf.close();

            sf.add(api, 'state').options(states).onChange(() => fadeToAction(api.state, 0.5));
            const ef = gui.addFolder('Emotes');
            ef.close();
            gui.close();
            emotes.forEach(name => {
                api[name] = () => { fadeToAction(name, 0.2); mixer.addEventListener('finished', function restore() {
                    mixer.removeEventListener('finished', restore); fadeToAction(api.state, 0.2);
                });};
                ef.add(api, name);
            });
            activeAction = actions['Walking']; activeAction.play();
        }

        function fadeToAction(name, duration) {
            previousAction = activeAction; activeAction = actions[name];
            if (previousAction !== activeAction) previousAction.fadeOut(duration);
            activeAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(duration).play();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const dt = clock.getDelta();
            if (mixer) mixer.update(dt);

            // Update Game Clock & Display Time (Imported from map.html)
            if (simulationTime && timeDisplay) {
                simulationTime.setSeconds(simulationTime.getSeconds() + dt);
                timeDisplay.innerText = "GAME CLOCK: " + simulationTime.toLocaleString();
            }

            pollBluetoothControllers();

            let computedMoveX = moveX + (inputConfig.keys.KeyD ? 1 : 0) - (inputConfig.keys.KeyA ? 1 : 0);
            let computedMoveZ = moveZ + (inputConfig.keys.KeyS ? 1 : 0) - (inputConfig.keys.KeyW ? 1 : 0);

            if (model && !orbitMode && gameActive) {
                if (activeVehicle) {
                    characterRotationY -= (lookX * dt * 3) + (computedMoveX * dt * 2.2);
                    lookX = 0;
                    activeVehicle.rotation.y = characterRotationY;
                    const fwdCar = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                    activeVehicle.position.add(fwdCar.multiplyScalar(computedMoveZ * dt * -38));
                    model.position.copy(activeVehicle.position);
                    model.rotation.y = characterRotationY;
                } else {
                    characterRotationY -= lookX * dt * 3;
                    model.rotation.y = characterRotationY;
                    lookX = 0;

                    const fwdWalk = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                    const sideWalk = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                    model.position.add(fwdWalk.multiplyScalar(computedMoveZ * dt * -15))
                                 .add(sideWalk.multiplyScalar(computedMoveX * dt * -15));
                }
                const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                
                const targetFOV = isMapView ? 65 : (isZoomed ? 20 : 65);
                const targetFar = isMapView ? 2800 : 600;
                if (Math.abs(camera.fov - targetFOV) > 0.1 || Math.abs(camera.far - targetFar) > 1) {
                    camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.15);
                    camera.far = targetFar;
                    camera.updateProjectionMatrix();
                }

                if (scene.fog) {
                    const targetFogNear = isMapView ? 2000 : 60;
                    const targetFogFar = isMapView ? 3800 : 500;
                    scene.fog.near = THREE.MathUtils.lerp(scene.fog.near, targetFogNear, 0.12);
                    scene.fog.far = THREE.MathUtils.lerp(scene.fog.far, targetFogFar, 0.12);
                }

                if (isMapView) {
                    const mapTargetPos = new THREE.Vector3(210, 1120, 235);
                    camera.position.lerp(mapTargetPos, 0.08);
                    camera.lookAt(210, 0, 235);
                } else {
                    let cameraOffset;
                    if (cameraModeIndex === 1) { 
                        cameraOffset = new THREE.Vector3(0, 2.8, 0.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                        camera.position.lerp(model.position.clone().add(cameraOffset), 0.2);
                        const lookTarget = model.position.clone().add(fwd.clone().multiplyScalar(20)).add(new THREE.Vector3(0, 2.5, 0));
                        camera.lookAt(lookTarget);
                    } else if (cameraModeIndex === 2) { 
                        cameraOffset = new THREE.Vector3(0, 45, -5).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                        camera.position.lerp(model.position.clone().add(cameraOffset), 0.1);
                        camera.lookAt(model.position.x, model.position.y, model.position.z);
                    } else { 
                        cameraOffset = new THREE.Vector3(0, 5, -15).applyAxisAngle(new THREE.Vector3(0, 1, 0), characterRotationY);
                        camera.position.lerp(model.position.clone().add(cameraOffset), 0.1);
                        camera.lookAt(model.position.x, model.position.y + 2, model.position.z);
                    }
                }
            }

            updateBullets(dt);
            updateBoss(dt);
            updateHealthPackages();
            updateAmbientTraffic(dt);
            updateUI();
            renderMinimap();
            renderer.render(scene, camera);
        }

        init();
    </script>
</div>
</body>
</html>
